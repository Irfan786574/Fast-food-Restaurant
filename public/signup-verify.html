<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify - HR Fastfood</title>
  <link rel="stylesheet" href="./css/verify.css">
</head>
<body>
  <header>
    <h1>Verify Your Account</h1>
  </header>

  <section class="verify">
    <form id="verifyForm">
      <input type="text" id="verificationCode" placeholder="Enter Verification Code" required>
      <button type="submit">Verify</button>
    </form>
    <p id="verifyErrorMessage" class="error"></p>
  </section>

  <footer>
    <p>&copy; 2025 HR Fastfood. All rights reserved.</p>
  </footer>

  <script>
    // Simulate verification process
    document.getElementById('verifyForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const verificationCode = document.getElementById('verificationCode').value;

      // Simulate sending verification request to backend
      fetch('http://localhost:5000/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ verificationCode })
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          // Redirect to the homepage or dashboard after successful verification
          window.location.href = 'index.html';  // Change this to your desired redirect
        } else {
          document.getElementById('verifyErrorMessage').textContent = 'Invalid verification code, please try again.';
        }
      })
      .catch(error => {
        console.error('Error during verification:', error);
        document.getElementById('verifyErrorMessage').textContent = 'Error during verification, please try again.';
      });
    });
  </script>
</body>
</html>
